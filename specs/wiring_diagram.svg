<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 850" font-family="Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5fb8d1"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb343"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b80"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1560" height="850" fill="#0f1f33"/>

  <!-- Legend -->
  <rect x="1180" y="12" width="360" height="112" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="1360" y="28" fill="#e7eef4" font-size="11" font-weight="bold" text-anchor="middle">LEGEND</text>
  <line x1="1195" y1="45" x2="1225" y2="45" stroke="#5fb8d1" marker-end="url(#arrow)"/>
  <text x="1233" y="49" fill="#9fb3c8" font-size="9">Positive / signal path</text>
  <line x1="1195" y1="65" x2="1225" y2="65" stroke="#5a6b80" marker-end="url(#arrow-gray)"/>
  <text x="1233" y="69" fill="#9fb3c8" font-size="9">Ground / return (confirmed, normal)</text>
  <line x1="1195" y1="85" x2="1225" y2="85" stroke="#ffb343" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="1233" y="89" fill="#9fb3c8" font-size="9">Ground / return — confirmed issue</text>
  <line x1="1195" y1="105" x2="1225" y2="105" stroke="#ffb343" stroke-dasharray="5,4" marker-end="url(#arrow-orange)"/>
  <text x="1233" y="109" fill="#9fb3c8" font-size="9">Planned — not yet built</text>

  <!-- Solar Array -->
  <rect x="600" y="12" width="300" height="55" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="750" y="32" fill="#e7eef4" font-size="14" font-weight="bold" text-anchor="middle">SOLAR ARRAY</text>
  <text x="750" y="48" fill="#9fb3c8" font-size="10" text-anchor="middle">7x SunPower C60 (series)</text>
  <text x="750" y="61" fill="#9fb3c8" font-size="10" text-anchor="middle">Voc≈5.0V  Vmp≈4.06V</text>
  <line x1="750" y1="67" x2="750" y2="95" stroke="#5fb8d1" marker-end="url(#arrow)"/>

  <!-- 5A total sensor -->
  <rect x="600" y="95" width="300" height="45" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="750" y="114" fill="#e7eef4" font-size="12" font-weight="bold" text-anchor="middle">5A CURRENT SENSOR</text>
  <text x="750" y="128" fill="#9fb3c8" font-size="9" text-anchor="middle">(bench-only — measures total array output)</text>
  <line x1="750" y1="140" x2="750" y2="158" stroke="#5fb8d1"/>

  <!-- split -->
  <line x1="250" y1="158" x2="1250" y2="158" stroke="#5fb8d1"/>
  <line x1="250" y1="158" x2="250" y2="178" stroke="#5fb8d1" marker-end="url(#arrow)"/>
  <line x1="750" y1="158" x2="750" y2="178" stroke="#5fb8d1" marker-end="url(#arrow)"/>
  <line x1="1250" y1="158" x2="1250" y2="178" stroke="#5fb8d1" marker-end="url(#arrow)"/>

  <!-- Branch labels -->
  <text x="250" y="172" fill="#ffb343" font-size="11" font-weight="bold" text-anchor="middle">BRANCH A — VBAT OR-ING TAP</text>
  <text x="750" y="172" fill="#7fd4e8" font-size="11" font-weight="bold" text-anchor="middle">BRANCH B — FPV RAIL</text>
  <text x="1250" y="172" fill="#7fd4e8" font-size="11" font-weight="bold" text-anchor="middle">BRANCH C — MAIN BUS</text>

  <!-- Branch A, 2nd input (planned, not yet wired) -->
  <rect x="30" y="35" width="210" height="46" rx="4" fill="#13253d" stroke="#ffb343" stroke-dasharray="5,4"/>
  <text x="135" y="54" fill="#ffb343" font-size="10" font-weight="bold" text-anchor="middle">MAIN BATTERY (2nd input)</text>
  <text x="135" y="68" fill="#ffb343" font-size="9" text-anchor="middle">PLANNED — not yet wired</text>
  <line x1="135" y1="81" x2="150" y2="178" stroke="#ffb343" stroke-dasharray="5,4" marker-end="url(#arrow-orange)"/>

  <!-- Branch A -->
  <rect x="80" y="178" width="340" height="60" rx="4" fill="#13253d" stroke="#ffb343"/>
  <text x="250" y="199" fill="#e7eef4" font-size="12" font-weight="bold" text-anchor="middle">Ideal Diode Pair</text>
  <text x="250" y="213" fill="#9fb3c8" font-size="9" text-anchor="middle">used as a true 2-input OR:</text>
  <text x="250" y="225" fill="#9fb3c8" font-size="9" text-anchor="middle">solar array + main battery</text>
  <line x1="250" y1="238" x2="250" y2="256" stroke="#5fb8d1" marker-end="url(#arrow)"/>

  <rect x="80" y="256" width="340" height="78" rx="4" fill="#13253d" stroke="#ffb343"/>
  <text x="250" y="276" fill="#e7eef4" font-size="12" font-weight="bold" text-anchor="middle">Flight Controller VBAT pin</text>
  <text x="250" y="290" fill="#9fb3c8" font-size="9" text-anchor="middle">FC's voltage-sense ADC — reads</text>
  <text x="250" y="302" fill="#9fb3c8" font-size="9" text-anchor="middle">whichever input is higher</text>
  <text x="250" y="320" fill="#ffb343" font-size="9" font-weight="bold" text-anchor="middle">⚠ 2nd input (battery) planned,</text>
  <text x="250" y="331" fill="#ffb343" font-size="9" font-weight="bold" text-anchor="middle">not yet physically wired</text>

  <!-- Branch A -> FC (shared box) diagonal -->
  <line x1="330" y1="334" x2="640" y2="560" stroke="#5fb8d1" marker-end="url(#arrow)"/>
  <text x="470" y="450" fill="#7fd4e8" font-size="10" text-anchor="middle" transform="rotate(38 470 450)">VBAT (sense)</text>

  <!-- Branch B -->
  <rect x="600" y="178" width="300" height="52" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="750" y="200" fill="#e7eef4" font-size="12" font-weight="bold" text-anchor="middle">Ideal Diode Module #1</text>
  <text x="750" y="215" fill="#9fb3c8" font-size="9" text-anchor="middle">(Pololu Ideal Diode Module)</text>
  <line x1="750" y1="230" x2="750" y2="248" stroke="#5fb8d1" marker-end="url(#arrow)"/>

  <rect x="620" y="248" width="260" height="40" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="750" y="273" fill="#e7eef4" font-size="12" font-weight="bold" text-anchor="middle">2A Current Meter</text>
  <line x1="750" y1="288" x2="750" y2="300" stroke="#5fb8d1"/>
  <line x1="650" y1="300" x2="850" y2="300" stroke="#5fb8d1"/>
  <line x1="650" y1="300" x2="650" y2="312" stroke="#5fb8d1" marker-end="url(#arrow)"/>
  <line x1="850" y1="300" x2="850" y2="312" stroke="#5fb8d1" marker-end="url(#arrow)"/>

  <rect x="530" y="312" width="240" height="55" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="650" y="332" fill="#e7eef4" font-size="11" font-weight="bold" text-anchor="middle">FPV Camera/VTX</text>
  <text x="650" y="346" fill="#9fb3c8" font-size="9" text-anchor="middle">AKK BA3 AIO Analog Cam + VTX</text>
  <text x="650" y="359" fill="#7fd4e8" font-size="9" font-style="italic" text-anchor="middle">(parallel)</text>

  <rect x="800" y="312" width="240" height="55" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="920" y="332" fill="#e7eef4" font-size="11" font-weight="bold" text-anchor="middle">FPV Battery</text>
  <text x="920" y="346" fill="#9fb3c8" font-size="9" text-anchor="middle">1S 400 mAh LiPo</text>
  <text x="920" y="359" fill="#7fd4e8" font-size="9" font-style="italic" text-anchor="middle">(parallel)</text>

  <!-- Branch C -->
  <rect x="1080" y="178" width="340" height="52" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="1250" y="200" fill="#e7eef4" font-size="12" font-weight="bold" text-anchor="middle">Ideal Diode Module #2</text>
  <text x="1250" y="215" fill="#9fb3c8" font-size="9" text-anchor="middle">(Pololu Ideal Diode Module)</text>
  <line x1="1250" y1="230" x2="1250" y2="248" stroke="#5fb8d1" marker-end="url(#arrow)"/>

  <rect x="1130" y="248" width="240" height="40" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="1250" y="273" fill="#e7eef4" font-size="12" font-weight="bold" text-anchor="middle">2A Current Meter</text>
  <line x1="1250" y1="288" x2="1250" y2="300" stroke="#5fb8d1"/>
  <line x1="1250" y1="300" x2="1250" y2="308" stroke="#5fb8d1"/>

  <!-- 3 parallel children of Branch C: trunk runs down at x=1250, each child
       box sits to the right, fed by a short horizontal tee -->
  <line x1="1250" y1="300" x2="1250" y2="448" stroke="#5fb8d1"/>
  <line x1="1250" y1="320" x2="1265" y2="320" stroke="#5fb8d1" marker-end="url(#arrow)"/>
  <line x1="1250" y1="384" x2="1265" y2="384" stroke="#5fb8d1" marker-end="url(#arrow)"/>
  <line x1="1250" y1="448" x2="1265" y2="448" stroke="#5fb8d1" marker-end="url(#arrow)"/>

  <rect x="1265" y="300" width="225" height="40" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="1377" y="316" fill="#e7eef4" font-size="10" font-weight="bold" text-anchor="middle">Main Battery</text>
  <text x="1377" y="329" fill="#9fb3c8" font-size="8" text-anchor="middle">18650 Li-ion, 2600 mAh, 1S</text>
  <text x="1377" y="340" fill="#7fd4e8" font-size="8" font-style="italic" text-anchor="middle">(parallel)</text>

  <rect x="1265" y="364" width="225" height="40" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="1377" y="378" fill="#e7eef4" font-size="10" font-weight="bold" text-anchor="middle">5A Sensor → ESC → Motor</text>
  <text x="1377" y="390" fill="#9fb3c8" font-size="8" text-anchor="middle">T-Motor M1104 KV7500, 6x3 prop</text>
  <text x="1377" y="401" fill="#7fd4e8" font-size="8" font-style="italic" text-anchor="middle">(parallel)</text>

  <!-- Capacitor at 5V Regulator VIN - confirmed installed 2026-07-23 -->
  <rect x="1060" y="413" width="150" height="34" rx="3" fill="#13253d" stroke="#2c4a6e"/>
  <text x="1135" y="426" fill="#e7eef4" font-size="9" font-weight="bold" text-anchor="middle">Capacitor — VIN</text>
  <text x="1135" y="438" fill="#9fb3c8" font-size="8" text-anchor="middle">installed 2026-07-23</text>
  <line x1="1210" y1="430" x2="1250" y2="448" stroke="#5fb8d1" marker-end="url(#arrow)"/>

  <rect x="1265" y="428" width="225" height="40" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="1377" y="444" fill="#e7eef4" font-size="10" font-weight="bold" text-anchor="middle">5V Regulator</text>
  <text x="1377" y="457" fill="#9fb3c8" font-size="8" text-anchor="middle">Pololu S7V7F5 (step-up/step-down)</text>
  <text x="1377" y="468" fill="#7fd4e8" font-size="8" font-style="italic" text-anchor="middle">(parallel)</text>

  <!-- 5V Regulator -> shared FC -->
  <line x1="1310" y1="468" x2="895" y2="558" stroke="#5fb8d1" marker-end="url(#arrow)"/>
  <text x="1130" y="530" fill="#7fd4e8" font-size="10" text-anchor="middle" transform="rotate(-13 1130 530)">5V (power, servo rail)</text>

  <!-- Shared Flight Controller -->
  <rect x="600" y="560" width="300" height="55" rx="4" fill="#13253d" stroke="#7fd4e8" stroke-width="2"/>
  <text x="750" y="582" fill="#e7eef4" font-size="13" font-weight="bold" text-anchor="middle">Flight Controller</text>
  <text x="750" y="597" fill="#9fb3c8" font-size="9" text-anchor="middle">ATOMRC F405 NAVI</text>

  <line x1="750" y1="615" x2="750" y2="628" stroke="#5fb8d1"/>
  <line x1="480" y1="628" x2="1020" y2="628" stroke="#5fb8d1"/>
  <line x1="480" y1="628" x2="480" y2="640" stroke="#5fb8d1" marker-end="url(#arrow)"/>
  <line x1="680" y1="628" x2="680" y2="640" stroke="#5fb8d1" marker-end="url(#arrow)"/>
  <line x1="880" y1="628" x2="880" y2="640" stroke="#5fb8d1" marker-end="url(#arrow)"/>
  <line x1="1020" y1="628" x2="1020" y2="640" stroke="#5fb8d1" marker-end="url(#arrow)"/>

  <rect x="400" y="640" width="160" height="42" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="480" y="666" fill="#e7eef4" font-size="10" text-anchor="middle">GPS — BN-880</text>

  <rect x="600" y="640" width="160" height="42" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="680" y="659" fill="#e7eef4" font-size="10" text-anchor="middle">Receiver</text>
  <text x="680" y="672" fill="#9fb3c8" font-size="8" text-anchor="middle">Happymodel EP1 ELRS</text>

  <rect x="800" y="640" width="160" height="42" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="880" y="659" fill="#e7eef4" font-size="10" text-anchor="middle">Telemetry Radio</text>
  <text x="880" y="672" fill="#9fb3c8" font-size="8" text-anchor="middle">915 MHz</text>

  <rect x="940" y="640" width="160" height="42" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="1020" y="659" fill="#e7eef4" font-size="10" text-anchor="middle">Servos ×4</text>
  <text x="1020" y="672" fill="#9fb3c8" font-size="8" text-anchor="middle">DM-S0020 micro</text>

  <!-- ============ NEGATIVE / RETURN PATHS (added 2026-07-23) ============ -->

  <!-- Negative return bus -->
  <rect x="1140" y="770" width="390" height="42" rx="4" fill="#13253d" stroke="#8a6a4a"/>
  <text x="1335" y="788" fill="#e7eef4" font-size="11" font-weight="bold" text-anchor="middle">⏚ NEGATIVE RETURN BUS</text>
  <text x="1335" y="802" fill="#9fb3c8" font-size="9" text-anchor="middle">(battery / solar array negative)</text>

  <!-- 5V Regulator ground -> bus (confirmed, normal) -->
  <line x1="1377" y1="468" x2="1377" y2="770" stroke="#5a6b80" marker-end="url(#arrow-gray)"/>
  <text x="1390" y="640" fill="#5a6b80" font-size="8">GND</text>

  <!-- ESC ground -> bus, routed left of the Branch C column (confirmed, normal) -->
  <polyline points="1265,384 1225,384 1225,770" fill="none" stroke="#5a6b80" marker-end="url(#arrow-gray)"/>
  <text x="1195" y="600" fill="#5a6b80" font-size="8">GND</text>

  <!-- Main Battery ground -> bus, routed right of the Branch C column (confirmed, normal) -->
  <polyline points="1490,320 1530,320 1530,770" fill="none" stroke="#5a6b80" marker-end="url(#arrow-gray)"/>
  <text x="1505" y="600" fill="#5a6b80" font-size="8">GND</text>

  <!-- FC's independent ground return (star ground) - confirmed built 2026-07-23,
       replacing the old ESC-routed path (removed from this diagram - see
       specs/wiring_diagram.md's dated history for the prior state) -->
  <polyline points="650,615 650,705 1150,705 1150,770" fill="none" stroke="#5a6b80" marker-end="url(#arrow-gray)"/>
  <text x="660" y="700" fill="#5a6b80" font-size="8">GND — independent FC ground</text>
  <text x="660" y="712" fill="#5a6b80" font-size="8">(star ground), confirmed 2026-07-23</text>

  <!-- Solar Array negative (called out, routing simplified for clarity) -->
  <text x="905" y="40" fill="#5a6b80" font-size="8">⏚ GND (→ negative bus,</text>
  <text x="905" y="51" fill="#5a6b80" font-size="8">routing simplified here)</text>
</svg>
