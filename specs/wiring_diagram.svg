<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1000" font-family="Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5fb8d1"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b80"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1700" height="1000" fill="#0f1f33"/>

  <!-- Legend -->
  <rect x="1400" y="20" width="280" height="115" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="1540" y="36" fill="#e7eef4" font-size="11" font-weight="bold" text-anchor="middle">LEGEND</text>
  <line x1="1415" y1="53" x2="1445" y2="53" stroke="#5fb8d1" marker-end="url(#arrow)"/>
  <text x="1453" y="57" fill="#9fb3c8" font-size="9">Positive / signal path</text>
  <line x1="1415" y1="73" x2="1445" y2="73" stroke="#5a6b80" marker-end="url(#arrow-gray)"/>
  <text x="1453" y="77" fill="#9fb3c8" font-size="9">Ground / return</text>
  <path d="M 1415 93 L 1432 93 A 6,6 0 0 1 1444 93 L 1445 93" fill="none" stroke="#9fb3c8" stroke-width="1.5"/>
  <text x="1453" y="97" fill="#9fb3c8" font-size="9">Hump = crossing, not connected</text>
  <line x1="1415" y1="113" x2="1437" y2="113" stroke="#5a6b80"/>
  <circle cx="1437" cy="113" r="4" fill="#0f1f33" stroke="#5a6b80"/>
  <text x="1453" y="117" fill="#9fb3c8" font-size="9">Open circle = floating, not tied to bus</text>

  <!-- ================= SOLAR ARRAY / SENSOR / SPLIT ================= -->

  <rect x="650" y="20" width="300" height="70" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="800" y="42" fill="#e7eef4" font-size="14" font-weight="bold" text-anchor="middle">SOLAR ARRAY</text>
  <text x="800" y="60" fill="#9fb3c8" font-size="10" text-anchor="middle">7x SunPower C60 (series)</text>
  <text x="800" y="75" fill="#9fb3c8" font-size="10" text-anchor="middle">Voc≈5.0V  Vmp≈4.06V</text>
  <line x1="800" y1="90" x2="800" y2="110" stroke="#5fb8d1" marker-end="url(#arrow)"/>

  <!-- Solar array negative: two independent lines, one off each side of
       the array box (2026-07-24), instead of a single shared distribution
       line. Each drops straight to its own diode's IN- pin at an x that
       falls outside the split's span (500-1120), so neither one needs to
       cross the split's positive line at all - no hump required. -->
  <polyline points="650,55 460,55 460,230" fill="none" stroke="#5a6b80" marker-end="url(#arrow-gray)"/>
  <text x="420" y="45" fill="#5a6b80" font-size="8">GND</text>
  <text x="437" y="225" fill="#5a6b80" font-size="7" text-anchor="middle">IN−</text>

  <polyline points="950,55 1160,55 1160,230" fill="none" stroke="#5a6b80" marker-end="url(#arrow-gray)"/>
  <text x="1170" y="45" fill="#5a6b80" font-size="8">GND</text>
  <text x="1183" y="225" fill="#5a6b80" font-size="7" text-anchor="middle">IN−</text>

  <rect x="650" y="110" width="300" height="55" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="800" y="132" fill="#e7eef4" font-size="12" font-weight="bold" text-anchor="middle">5A CURRENT SENSOR</text>
  <text x="800" y="147" fill="#9fb3c8" font-size="9" text-anchor="middle">(bench-only — total array output; positive-line-only, no ground pin)</text>
  <line x1="800" y1="165" x2="800" y2="190" stroke="#5fb8d1"/>

  <!-- split: 2-way (Branch A eliminated 2026-07-24) -->
  <line x1="500" y1="190" x2="1120" y2="190" stroke="#5fb8d1"/>
  <line x1="500" y1="190" x2="500" y2="230" stroke="#5fb8d1" marker-end="url(#arrow)"/>
  <line x1="1120" y1="190" x2="1120" y2="230" stroke="#5fb8d1" marker-end="url(#arrow)"/>
  <text x="500" y="207" fill="#7fd4e8" font-size="11" font-weight="bold" text-anchor="middle">BRANCH B — FPV RAIL</text>
  <text x="1120" y="207" fill="#7fd4e8" font-size="11" font-weight="bold" text-anchor="middle">BRANCH C — MAIN BUS</text>

  <!-- ================= BRANCH B — FPV RAIL ================= -->

  <rect x="350" y="230" width="300" height="60" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="500" y="253" fill="#e7eef4" font-size="12" font-weight="bold" text-anchor="middle">Ideal Diode Module #1</text>
  <text x="500" y="268" fill="#9fb3c8" font-size="9" text-anchor="middle">(Pololu Ideal Diode Module)</text>
  <text x="430" y="241" fill="#5a6b80" font-size="7" text-anchor="middle">OUT−</text>
  <line x1="500" y1="290" x2="500" y2="320" stroke="#5fb8d1" marker-end="url(#arrow)"/>

  <!-- Diode #1 OUT- -> Branch B ground lane -->
  <path d="M 430,290 L 430,305 L 180,305" fill="none" stroke="#5a6b80"/>

  <rect x="380" y="320" width="240" height="45" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="500" y="345" fill="#e7eef4" font-size="12" font-weight="bold" text-anchor="middle">2A Current Meter</text>
  <text x="500" y="358" fill="#9fb3c8" font-size="8" text-anchor="middle">(positive-line-only, no ground pin)</text>
  <line x1="500" y1="365" x2="500" y2="380" stroke="#5fb8d1"/>
  <line x1="360" y1="380" x2="640" y2="380" stroke="#5fb8d1"/>
  <line x1="360" y1="380" x2="360" y2="400" stroke="#5fb8d1" marker-end="url(#arrow)"/>
  <line x1="640" y1="380" x2="640" y2="400" stroke="#5fb8d1" marker-end="url(#arrow)"/>

  <rect x="230" y="400" width="260" height="60" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="360" y="422" fill="#e7eef4" font-size="11" font-weight="bold" text-anchor="middle">FPV Camera/VTX</text>
  <text x="360" y="436" fill="#9fb3c8" font-size="9" text-anchor="middle">AKK BA3 AIO Analog Cam + VTX</text>
  <text x="360" y="450" fill="#7fd4e8" font-size="9" font-style="italic" text-anchor="middle">(parallel)</text>

  <rect x="510" y="400" width="260" height="60" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="640" y="422" fill="#e7eef4" font-size="11" font-weight="bold" text-anchor="middle">FPV Battery</text>
  <text x="640" y="436" fill="#9fb3c8" font-size="9" text-anchor="middle">1S 400 mAh LiPo</text>
  <text x="640" y="450" fill="#7fd4e8" font-size="9" font-style="italic" text-anchor="middle">(parallel)</text>

  <!-- FPV Camera + FPV Battery grounds -> Branch B ground lane -->
  <path d="M 360,460 L 360,475 L 180,475" fill="none" stroke="#5a6b80"/>
  <path d="M 640,460 L 640,475 L 180,475" fill="none" stroke="#5a6b80"/>

  <!-- Branch B ground lane: collects Diode #1 OUT- and both FPV loads'
       grounds into one local loop. Confirmed 2026-07-24: this loop is NOT
       tied to the Negative Return Bus - Branch B's ground is fully
       isolated from Branch C / the rest of the system, not just the
       positive side. Lane ends in an open circle (floating, by design/
       as-built - not a rendering cutoff) rather than reaching the bus. -->
  <line x1="180" y1="305" x2="180" y2="510" stroke="#5a6b80"/>
  <circle cx="180" cy="510" r="4" fill="#0f1f33" stroke="#5a6b80"/>
  <text x="150" y="600" fill="#5a6b80" font-size="8" text-anchor="middle" transform="rotate(-90 150 600)">GND — Branch B (Diode #1 OUT− + FPV Camera + FPV Battery) — ISOLATED, not tied to the negative return bus</text>

  <!-- ================= BRANCH C — MAIN BUS ================= -->

  <rect x="950" y="230" width="340" height="60" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="1120" y="253" fill="#e7eef4" font-size="12" font-weight="bold" text-anchor="middle">Ideal Diode Module #2</text>
  <text x="1120" y="268" fill="#9fb3c8" font-size="9" text-anchor="middle">(Pololu Ideal Diode Module)</text>
  <text x="1200" y="241" fill="#5a6b80" font-size="7" text-anchor="middle">OUT−</text>
  <line x1="1120" y1="290" x2="1120" y2="320" stroke="#5fb8d1" marker-end="url(#arrow)"/>

  <!-- Diode #2 OUT- -> Branch C ground lane -->
  <path d="M 1200,290 L 1200,305 L 1550,305" fill="none" stroke="#5a6b80"/>

  <rect x="1000" y="320" width="240" height="45" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="1120" y="345" fill="#e7eef4" font-size="12" font-weight="bold" text-anchor="middle">2A Current Meter</text>
  <text x="1120" y="358" fill="#9fb3c8" font-size="8" text-anchor="middle">(positive-line-only, no ground pin)</text>
  <line x1="1120" y1="365" x2="1120" y2="390" stroke="#5fb8d1"/>

  <!-- Trunk: 3 parallel children (Main Battery, ESC-leg, 5V Regulator),
       each fed by a short tee from this single vertical run. -->
  <line x1="1120" y1="390" x2="1120" y2="600" stroke="#5fb8d1"/>
  <line x1="1120" y1="415" x2="1150" y2="415" stroke="#5fb8d1" marker-end="url(#arrow)"/>
  <line x1="1120" y1="477" x2="1150" y2="477" stroke="#5fb8d1" marker-end="url(#arrow)"/>
  <line x1="1120" y1="600" x2="1150" y2="600" stroke="#5fb8d1" marker-end="url(#arrow)"/>

  <rect x="1150" y="390" width="330" height="50" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="1315" y="410" fill="#e7eef4" font-size="10" font-weight="bold" text-anchor="middle">Main Battery</text>
  <text x="1315" y="423" fill="#9fb3c8" font-size="8" text-anchor="middle">18650 Li-ion, 2600 mAh, 1S</text>
  <text x="1315" y="434" fill="#7fd4e8" font-size="8" font-style="italic" text-anchor="middle">(parallel)</text>
  <path d="M 1480,415 L 1550,415" fill="none" stroke="#5a6b80"/>

  <!-- 5A Sensor (ESC leg): drawn as its own box, separate from the ESC,
       since it's a positive-line-only inline sensor with no ground pin -
       distinct from the ESC/Motor stage that follows it in series. -->
  <rect x="1150" y="460" width="330" height="35" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="1315" y="482" fill="#e7eef4" font-size="10" font-weight="bold" text-anchor="middle">5A Sensor (Branch C / ESC leg) — positive-line-only</text>
  <line x1="1315" y1="495" x2="1315" y2="505" stroke="#5fb8d1"/>

  <rect x="1150" y="505" width="330" height="50" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="1315" y="525" fill="#e7eef4" font-size="10" font-weight="bold" text-anchor="middle">ESC → Motor</text>
  <text x="1315" y="538" fill="#9fb3c8" font-size="8" text-anchor="middle">T-Motor M1104 KV7500, 6x3 prop</text>
  <text x="1315" y="549" fill="#7fd4e8" font-size="8" font-style="italic" text-anchor="middle">(parallel)</text>
  <path d="M 1480,535 L 1550,535" fill="none" stroke="#5a6b80"/>

  <!-- VBAT tap: ESC red pin -> FC VBAT (replaces the old Branch A diode-OR
       tap). Own dedicated column at x=1520, clear of every box. -->
  <path d="M 1480,520 L 1520,520 L 1520,690 L 850,690 L 850,700" fill="none" stroke="#5fb8d1" marker-end="url(#arrow)"/>
  <text x="1250" y="683" fill="#7fd4e8" font-size="10" text-anchor="middle">VBAT — ESC red pin (bus voltage)</text>

  <!-- Capacitor at 5V Regulator VIN, installed 2026-07-23 -->
  <rect x="950" y="580" width="150" height="35" rx="3" fill="#13253d" stroke="#2c4a6e"/>
  <text x="1025" y="598" fill="#e7eef4" font-size="9" font-weight="bold" text-anchor="middle">Capacitor — VIN</text>
  <text x="1025" y="610" fill="#9fb3c8" font-size="8" text-anchor="middle">installed 2026-07-23</text>
  <line x1="1100" y1="600" x2="1120" y2="600" stroke="#5fb8d1"/>

  <rect x="1150" y="575" width="330" height="50" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="1315" y="595" fill="#e7eef4" font-size="10" font-weight="bold" text-anchor="middle">5V Regulator</text>
  <text x="1315" y="608" fill="#9fb3c8" font-size="8" text-anchor="middle">Pololu S7V7F5 (step-up/step-down)</text>
  <text x="1315" y="619" fill="#7fd4e8" font-size="8" font-style="italic" text-anchor="middle">(parallel)</text>
  <path d="M 1480,610 L 1550,610" fill="none" stroke="#5a6b80"/>

  <!-- 5V Regulator -> FC (servo rail power) -->
  <path d="M 1315,625 L 1315,655 L 750,655 L 750,700" fill="none" stroke="#5fb8d1" marker-end="url(#arrow)"/>
  <text x="1050" y="648" fill="#7fd4e8" font-size="10" text-anchor="middle">5V (power, servo rail)</text>

  <!-- Branch C ground lane: one straight run, clear of every box in this
       branch, collecting Diode #2 OUT-, Main Battery, ESC/Motor, and
       5V Regulator grounds. -->
  <line x1="1550" y1="305" x2="1550" y2="920" stroke="#5a6b80" marker-end="url(#arrow-gray)"/>
  <text x="1585" y="600" fill="#5a6b80" font-size="8" text-anchor="middle" transform="rotate(-90 1585 600)">GND — Branch C (Diode #2 OUT− + Main Battery + ESC + 5V Regulator)</text>

  <!-- ================= SHARED FLIGHT CONTROLLER ================= -->

  <rect x="650" y="700" width="300" height="60" rx="4" fill="#13253d" stroke="#7fd4e8" stroke-width="2"/>
  <text x="800" y="724" fill="#e7eef4" font-size="13" font-weight="bold" text-anchor="middle">Flight Controller</text>
  <text x="800" y="740" fill="#9fb3c8" font-size="9" text-anchor="middle">ATOMRC F405 NAVI</text>

  <!-- FC's independent ground return (star ground), confirmed built 2026-07-23 -->
  <path d="M 650,730 L 420,730 L 420,920" fill="none" stroke="#5a6b80" marker-end="url(#arrow-gray)"/>
  <text x="330" y="726" fill="#5a6b80" font-size="8">GND — independent FC ground (star), 2026-07-23</text>

  <line x1="800" y1="760" x2="800" y2="775" stroke="#5fb8d1"/>
  <line x1="545" y1="775" x2="1055" y2="775" stroke="#5fb8d1"/>
  <line x1="545" y1="775" x2="545" y2="795" stroke="#5fb8d1" marker-end="url(#arrow)"/>
  <line x1="715" y1="775" x2="715" y2="795" stroke="#5fb8d1" marker-end="url(#arrow)"/>
  <line x1="885" y1="775" x2="885" y2="795" stroke="#5fb8d1" marker-end="url(#arrow)"/>
  <line x1="1055" y1="775" x2="1055" y2="795" stroke="#5fb8d1" marker-end="url(#arrow)"/>

  <rect x="470" y="795" width="150" height="45" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="545" y="815" fill="#e7eef4" font-size="10" text-anchor="middle">GPS — BN-880</text>

  <rect x="640" y="795" width="150" height="45" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="715" y="812" fill="#e7eef4" font-size="10" text-anchor="middle">Receiver</text>
  <text x="715" y="826" fill="#9fb3c8" font-size="8" text-anchor="middle">Happymodel EP1 ELRS</text>

  <rect x="810" y="795" width="150" height="45" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="885" y="812" fill="#e7eef4" font-size="10" text-anchor="middle">Telemetry Radio</text>
  <text x="885" y="826" fill="#9fb3c8" font-size="8" text-anchor="middle">915 MHz</text>

  <rect x="980" y="795" width="150" height="45" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="1055" y="812" fill="#e7eef4" font-size="10" text-anchor="middle">Servos ×4</text>
  <text x="1055" y="826" fill="#9fb3c8" font-size="8" text-anchor="middle">DM-S0020 micro</text>

  <!-- ================= NEGATIVE RETURN BUS ================= -->

  <rect x="40" y="920" width="1620" height="50" rx="4" fill="#13253d" stroke="#8a6a4a"/>
  <text x="850" y="941" fill="#e7eef4" font-size="11" font-weight="bold" text-anchor="middle">⏚ NEGATIVE RETURN BUS</text>
  <text x="850" y="957" fill="#9fb3c8" font-size="9" text-anchor="middle">(battery / solar array negative)</text>
</svg>
