<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 1040" font-family="Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5fb8d1"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b80"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="950" height="1040" fill="#0f1f33"/>

  <!-- Legend -->
  <rect x="650" y="20" width="280" height="130" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="790" y="36" fill="#e7eef4" font-size="11" font-weight="bold" text-anchor="middle">LEGEND</text>
  <line x1="665" y1="53" x2="695" y2="53" stroke="#5fb8d1" marker-end="url(#arrow)"/>
  <text x="703" y="57" fill="#9fb3c8" font-size="9">Positive / signal path</text>
  <line x1="665" y1="73" x2="695" y2="73" stroke="#5a6b80" marker-end="url(#arrow-gray)"/>
  <text x="703" y="77" fill="#9fb3c8" font-size="9">Ground / return</text>
  <path d="M 665 93 L 682 93 A 6,6 0 0 1 694 93 L 695 93" fill="none" stroke="#9fb3c8" stroke-width="1.5"/>
  <text x="703" y="97" fill="#9fb3c8" font-size="9">Hump = crossing, not connected</text>
  <circle cx="680" cy="113" r="4" fill="#5a6b80"/>
  <text x="703" y="117" fill="#9fb3c8" font-size="9">Filled dot = connected junction</text>
  <circle cx="680" cy="133" r="4" fill="#0f1f33" stroke="#5a6b80"/>
  <text x="703" y="137" fill="#9fb3c8" font-size="9">Open circle = floating, not tied to bus</text>

  <!-- ================= SOLAR ARRAY / SENSOR / SPLIT ================= -->

  <rect x="300" y="20" width="300" height="70" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="450" y="42" fill="#e7eef4" font-size="14" font-weight="bold" text-anchor="middle">SOLAR ARRAY</text>
  <text x="450" y="60" fill="#9fb3c8" font-size="10" text-anchor="middle">7x SunPower C60 (series)</text>
  <text x="450" y="75" fill="#9fb3c8" font-size="10" text-anchor="middle">Voc≈5.0V  Vmp≈4.06V</text>
  <line x1="450" y1="90" x2="450" y2="110" stroke="#5fb8d1" marker-end="url(#arrow)"/>

  <!-- Solar array negative: two independent lines, one off each side,
       each dropping to its own diode's IN- pin at an x outside the
       split's span (200-700) so neither crosses the positive path. -->
  <polyline points="300,55 170,55 170,230" fill="none" stroke="#5a6b80" marker-end="url(#arrow-gray)"/>
  <text x="130" y="45" fill="#5a6b80" font-size="8">GND</text>
  <text x="147" y="225" fill="#5a6b80" font-size="7" text-anchor="middle">IN−</text>

  <!-- Routed via x=615 (clear of the sensor box) then jogged at y=180
       (below the Legend box, which ends at y=150, and above the split at
       y=190) before dropping to the diode - keeps clear of both boxes. -->
  <path d="M 600,55 L 615,55 L 615,180 L 730,180 L 730,230" fill="none" stroke="#5a6b80" marker-end="url(#arrow-gray)"/>
  <text x="622" y="70" fill="#5a6b80" font-size="8">GND</text>
  <text x="753" y="225" fill="#5a6b80" font-size="7" text-anchor="middle">IN−</text>

  <rect x="300" y="110" width="300" height="55" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="450" y="132" fill="#e7eef4" font-size="12" font-weight="bold" text-anchor="middle">5A CURRENT SENSOR</text>
  <text x="450" y="147" fill="#9fb3c8" font-size="9" text-anchor="middle">(bench-only — positive-line-only, no ground pin)</text>
  <line x1="450" y1="165" x2="450" y2="190" stroke="#5fb8d1"/>

  <!-- split: 2-way (Branch A eliminated 2026-07-24) -->
  <line x1="200" y1="190" x2="700" y2="190" stroke="#5fb8d1"/>
  <line x1="200" y1="190" x2="200" y2="230" stroke="#5fb8d1" marker-end="url(#arrow)"/>
  <line x1="700" y1="190" x2="700" y2="230" stroke="#5fb8d1" marker-end="url(#arrow)"/>
  <text x="200" y="207" fill="#7fd4e8" font-size="11" font-weight="bold" text-anchor="middle">BRANCH B — FPV RAIL</text>
  <text x="700" y="207" fill="#7fd4e8" font-size="11" font-weight="bold" text-anchor="middle">BRANCH C — MAIN BUS</text>

  <!-- ================= BRANCH B — FPV RAIL (isolated ground) ================= -->

  <rect x="50" y="230" width="300" height="60" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="200" y="253" fill="#e7eef4" font-size="12" font-weight="bold" text-anchor="middle">Ideal Diode Module #1</text>
  <text x="200" y="268" fill="#9fb3c8" font-size="9" text-anchor="middle">(Pololu Ideal Diode Module)</text>
  <text x="130" y="241" fill="#5a6b80" font-size="7" text-anchor="middle">OUT−</text>
  <line x1="200" y1="290" x2="200" y2="350" stroke="#5fb8d1" marker-end="url(#arrow)"/>

  <!-- Diode #1 OUT- -> Branch B ground lane -->
  <path d="M 110,290 L 110,320 L 30,320" fill="none" stroke="#5a6b80"/>

  <rect x="80" y="350" width="240" height="45" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="200" y="373" fill="#e7eef4" font-size="12" font-weight="bold" text-anchor="middle">2A Current Meter</text>
  <text x="200" y="386" fill="#9fb3c8" font-size="8" text-anchor="middle">(positive-line-only, no ground pin)</text>
  <line x1="200" y1="395" x2="200" y2="430" stroke="#5fb8d1"/>
  <line x1="160" y1="430" x2="400" y2="430" stroke="#5fb8d1"/>
  <line x1="160" y1="430" x2="160" y2="450" stroke="#5fb8d1" marker-end="url(#arrow)"/>
  <line x1="400" y1="430" x2="400" y2="450" stroke="#5fb8d1" marker-end="url(#arrow)"/>

  <rect x="50" y="450" width="220" height="60" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="160" y="472" fill="#e7eef4" font-size="11" font-weight="bold" text-anchor="middle">FPV Camera/VTX</text>
  <text x="160" y="486" fill="#9fb3c8" font-size="9" text-anchor="middle">AKK BA3 AIO Analog Cam + VTX</text>
  <text x="160" y="500" fill="#7fd4e8" font-size="9" font-style="italic" text-anchor="middle">(parallel)</text>

  <rect x="290" y="450" width="220" height="60" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="400" y="472" fill="#e7eef4" font-size="11" font-weight="bold" text-anchor="middle">FPV Battery</text>
  <text x="400" y="486" fill="#9fb3c8" font-size="9" text-anchor="middle">1S 400 mAh LiPo</text>
  <text x="400" y="500" fill="#7fd4e8" font-size="9" font-style="italic" text-anchor="middle">(parallel)</text>

  <!-- FPV Camera + FPV Battery grounds -> Branch B ground lane -->
  <path d="M 160,510 L 160,525 L 30,525" fill="none" stroke="#5a6b80"/>
  <path d="M 400,510 L 400,525 L 30,525" fill="none" stroke="#5a6b80"/>

  <!-- Branch B ground lane: confirmed 2026-07-24 this loop is NOT tied to
       the return line - fully isolated from Branch C / the rest of the
       system. Ends in an open circle (floating, by design/as-built). -->
  <line x1="30" y1="320" x2="30" y2="600" stroke="#5a6b80"/>
  <circle cx="30" cy="600" r="4" fill="#0f1f33" stroke="#5a6b80"/>
  <text x="18" y="450" fill="#5a6b80" font-size="8" text-anchor="middle" transform="rotate(-90 18 450)">GND — Branch B (Diode #1 OUT− + FPV Camera + FPV Battery) — ISOLATED</text>

  <!-- ================= BRANCH C — MAIN BUS ================= -->

  <rect x="550" y="230" width="300" height="60" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="700" y="253" fill="#e7eef4" font-size="12" font-weight="bold" text-anchor="middle">Ideal Diode Module #2</text>
  <text x="700" y="268" fill="#9fb3c8" font-size="9" text-anchor="middle">(Pololu Ideal Diode Module)</text>
  <text x="765" y="241" fill="#5a6b80" font-size="7" text-anchor="middle">OUT−</text>
  <line x1="700" y1="290" x2="700" y2="350" stroke="#5fb8d1" marker-end="url(#arrow)"/>

  <!-- Diode #2 OUT- -> Branch C ground lane. Exits to the right of the
       positive line (x=765 vs x=700) since the lane is on the right
       (x=920) - keeps the two lines diverging instead of the ground
       line overlapping/crossing back over the positive line to get
       there. Offset from the IN- pin (x=730) too, so the two negative
       pins don't stack into one line through the box. -->
  <path d="M 765,290 L 765,320 L 920,320" fill="none" stroke="#5a6b80"/>

  <rect x="580" y="350" width="240" height="45" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="700" y="373" fill="#e7eef4" font-size="12" font-weight="bold" text-anchor="middle">2A Current Meter</text>
  <text x="700" y="386" fill="#9fb3c8" font-size="8" text-anchor="middle">(positive-line-only, no ground pin)</text>
  <line x1="700" y1="395" x2="700" y2="430" stroke="#5fb8d1"/>

  <!-- Trunk: 4 parallel children (Main Battery, ESC-leg sensor, VIN
       Capacitor, 5V Regulator), each fed by a short tee. -->
  <line x1="700" y1="430" x2="700" y2="762" stroke="#5fb8d1"/>
  <line x1="700" y1="472" x2="730" y2="472" stroke="#5fb8d1" marker-end="url(#arrow)"/>
  <line x1="700" y1="570" x2="730" y2="570" stroke="#5fb8d1" marker-end="url(#arrow)"/>
  <line x1="700" y1="697" x2="730" y2="697" stroke="#5fb8d1" marker-end="url(#arrow)"/>
  <line x1="700" y1="762" x2="730" y2="762" stroke="#5fb8d1" marker-end="url(#arrow)"/>

  <rect x="730" y="445" width="170" height="55" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="815" y="463" fill="#e7eef4" font-size="9" font-weight="bold" text-anchor="middle">Main Battery</text>
  <text x="815" y="475" fill="#9fb3c8" font-size="7" text-anchor="middle">18650 Li-ion, 2600 mAh, 1S</text>
  <text x="815" y="486" fill="#7fd4e8" font-size="7" font-style="italic" text-anchor="middle">(parallel)</text>
  <path d="M 900,472 L 920,472" fill="none" stroke="#5a6b80"/>

  <!-- 5A Sensor (ESC leg): own box, separate from the ESC, since it's a
       positive-line-only inline sensor with no ground pin. -->
  <rect x="730" y="550" width="170" height="40" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="815" y="567" fill="#e7eef4" font-size="9" font-weight="bold" text-anchor="middle">5A Sensor (ESC leg)</text>
  <text x="815" y="580" fill="#9fb3c8" font-size="7" text-anchor="middle">positive-line-only, no ground pin</text>
  <line x1="815" y1="590" x2="815" y2="600" stroke="#5fb8d1"/>

  <rect x="730" y="600" width="170" height="55" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="815" y="618" fill="#e7eef4" font-size="9" font-weight="bold" text-anchor="middle">ESC → Motor</text>
  <text x="815" y="630" fill="#9fb3c8" font-size="7" text-anchor="middle">T-Motor M1104 KV7500, 6x3 prop</text>
  <text x="815" y="641" fill="#7fd4e8" font-size="7" font-style="italic" text-anchor="middle">(parallel)</text>
  <path d="M 900,627 L 920,627" fill="none" stroke="#5a6b80"/>

  <!-- VBAT tap: ESC red pin -> FC VBAT. Exits ESC's left edge (its top
       entry is used for the sensor's series output, not this), humps once
       over the trunk itself (a single crossing, at the ESC's own exit
       height, before the trunk's next tee), then routes down the trunk's
       left side - clear of every tee - before turning for FC. -->
  <path d="M 730,615 L 715,615 A 8,8 0 0 1 685,615 L 685,800 L 400,800 L 400,870"
        fill="none" stroke="#5fb8d1" marker-end="url(#arrow)"/>
  <text x="560" y="795" fill="#7fd4e8" font-size="9" text-anchor="middle">VBAT — ESC red pin (bus voltage)</text>

  <!-- Capacitor at 5V Regulator VIN, installed 2026-07-23. Positioned
       directly above the Regulator (2026-07-24) - it's wired across
       VIN, i.e. it taps BOTH the same positive trunk node and the same
       ground node the Regulator uses, not just the positive rail. Drawn
       as its own parallel tap off the trunk, same pattern as Main
       Battery / ESC-leg Sensor / Regulator. -->
  <rect x="730" y="680" width="170" height="35" rx="3" fill="#13253d" stroke="#2c4a6e"/>
  <text x="815" y="694" fill="#e7eef4" font-size="8" font-weight="bold" text-anchor="middle">Capacitor — VIN</text>
  <text x="815" y="706" fill="#9fb3c8" font-size="7" text-anchor="middle">installed 2026-07-23</text>
  <path d="M 900,697 L 920,697" fill="none" stroke="#5a6b80"/>

  <rect x="730" y="735" width="170" height="55" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="815" y="753" fill="#e7eef4" font-size="9" font-weight="bold" text-anchor="middle">5V Regulator</text>
  <text x="815" y="765" fill="#9fb3c8" font-size="7" text-anchor="middle">Pololu S7V7F5 (step-up/step-down)</text>
  <text x="815" y="776" fill="#7fd4e8" font-size="7" font-style="italic" text-anchor="middle">(parallel)</text>
  <path d="M 900,762 L 920,762" fill="none" stroke="#5a6b80"/>

  <!-- 5V Regulator -> FC (servo rail power). Turns below the VBAT tap's
       own turn (y=800), so the two lines' final approaches to the FC
       never cross. -->
  <path d="M 815,790 L 815,815 L 500,815 L 500,870" fill="none" stroke="#5fb8d1" marker-end="url(#arrow)"/>
  <text x="660" y="810" fill="#7fd4e8" font-size="9" text-anchor="middle">5V (power, servo rail)</text>

  <!-- Branch C ground lane. Extends down to y=900 to receive the FC's
       own ground directly (2026-07-24) - see below - instead of the FC
       looping all the way to the left margin to reach a separate
       full-width return line. -->
  <line x1="920" y1="320" x2="920" y2="900" stroke="#5a6b80"/>
  <circle cx="920" cy="900" r="4" fill="#5a6b80"/>
  <text x="935" y="620" fill="#5a6b80" font-size="8" text-anchor="middle" transform="rotate(-90 935 620)">GND — Branch C (Diode #2 OUT− + Main Battery + ESC + 5V Regulator) + FC (independent star ground)</text>

  <!-- ================= SHARED FLIGHT CONTROLLER ================= -->

  <rect x="300" y="870" width="300" height="60" rx="4" fill="#13253d" stroke="#7fd4e8" stroke-width="2"/>
  <text x="450" y="894" fill="#e7eef4" font-size="13" font-weight="bold" text-anchor="middle">Flight Controller</text>
  <text x="450" y="910" fill="#9fb3c8" font-size="9" text-anchor="middle">ATOMRC F405 NAVI</text>

  <!-- FC's independent ground return (star ground), confirmed built
       2026-07-23. Exits the FC's right edge (2026-07-24) and ties
       directly into Branch C's ground lane close by, rather than
       looping left around the peripheral boxes to reach a separate
       return line on the far margin. -->
  <path d="M 600,900 L 920,900" fill="none" stroke="#5a6b80"/>
  <text x="760" y="896" fill="#5a6b80" font-size="8" text-anchor="middle">GND — independent FC ground (star), 2026-07-23</text>

  <line x1="450" y1="930" x2="450" y2="945" stroke="#5fb8d1"/>
  <line x1="195" y1="945" x2="705" y2="945" stroke="#5fb8d1"/>
  <line x1="195" y1="945" x2="195" y2="965" stroke="#5fb8d1" marker-end="url(#arrow)"/>
  <line x1="365" y1="945" x2="365" y2="965" stroke="#5fb8d1" marker-end="url(#arrow)"/>
  <line x1="535" y1="945" x2="535" y2="965" stroke="#5fb8d1" marker-end="url(#arrow)"/>
  <line x1="705" y1="945" x2="705" y2="965" stroke="#5fb8d1" marker-end="url(#arrow)"/>

  <rect x="120" y="965" width="150" height="45" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="195" y="985" fill="#e7eef4" font-size="10" text-anchor="middle">GPS — BN-880</text>

  <rect x="290" y="965" width="150" height="45" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="365" y="982" fill="#e7eef4" font-size="10" text-anchor="middle">Receiver</text>
  <text x="365" y="996" fill="#9fb3c8" font-size="8" text-anchor="middle">Happymodel EP1 ELRS</text>

  <rect x="460" y="965" width="150" height="45" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="535" y="982" fill="#e7eef4" font-size="10" text-anchor="middle">Telemetry Radio</text>
  <text x="535" y="996" fill="#9fb3c8" font-size="8" text-anchor="middle">915 MHz</text>

  <rect x="630" y="965" width="150" height="45" rx="4" fill="#13253d" stroke="#2c4a6e"/>
  <text x="705" y="982" fill="#e7eef4" font-size="10" text-anchor="middle">Servos ×4</text>
  <text x="705" y="996" fill="#9fb3c8" font-size="8" text-anchor="middle">DM-S0020 micro</text>

  <!-- Negative return: no bus block and no separate return line - the
       FC's ground ties directly into Branch C's lane above (see the
       lane's own label for what it collects). -->
</svg>
